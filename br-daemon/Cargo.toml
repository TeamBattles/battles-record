[package]
name = "br-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
async-trait = "0.1"

axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
toml = "1"
m3u8-rs = "6"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
bcrypt = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
futures = "0.3"
tokio-tungstenite = "0.30"
parking_lot = "0.13"
urlencoding = "2"
serde_urlencoded = "0.7"
rand = "0.10"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
hex = "0.4"
async-channel = "2"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
image = "0.25"
which = "8"

# Image generation (rich thumbnails with text, gradients, colors)
ab_glyph = "0.2"           # Font rendering
tiny-skia = "0.12"         # 2D graphics with gradient support
palette = "0.7"            # Color space conversions
kmeans_colors = "0.7"      # Dominant color extraction from images

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
br-daemon = { path = ".", features = ["test-utils"] }

[features]
default = []
test-utils = []

# FFmpeg is shipped as a zip on Windows and macOS (Linux uses tar.xz)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
tar = "0.4"
xz2 = "0.1"
