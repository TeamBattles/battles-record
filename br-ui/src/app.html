<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<script>
			// Set dark mode class immediately (before CSS loads)
			(function() {
				var saved = localStorage.getItem('theme');
				var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				var isDark = saved === 'dark' || (saved !== 'light' && prefersDark);
				if (isDark) document.documentElement.classList.add('dark');
			})();
		</script>
		<style>
			/* Critical inline CSS - prevents white flash */
			html, body { margin: 0; padding: 0; background-color: #f7f7f7; }
			html.dark, html.dark body { background-color: #141418; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
